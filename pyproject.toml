[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-planner"
version = "0.1.0"
description = "Local-first desktop app for planning gym, running and swimming workouts."
requires-python = ">=3.11"
authors = [{ name = "Fitness Planner" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "customtkinter>=5.2.2",
    "matplotlib>=3.8",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "black>=24.4",
]

[project.scripts]
fitness-planner = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
